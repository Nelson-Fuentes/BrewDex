name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # El sitio vive en https://<usuario>.github.io/<repo>/ → base href con el nombre del repo.
      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # Fallback SPA: GitHub Pages sirve 404.html en rutas profundas; al ser el mismo index, Angular resuelve la ruta.
      - name: SPA fallback
        run: cp dist/brewdex/browser/index.html dist/brewdex/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/brewdex/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
